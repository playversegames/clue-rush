  const hs=R.order.map(i=>{const l=[];for(let r=1;r<=R.round;r++){const t=P[i]&&P[i]["h"+R.game+"_"+r];if(t!==undefined)l.push(`round ${r}: "${t}"`)}return `${nmb(i,b)}${isOut(i)?" (out)":""}: ${l.join("; ")}`}).join("\n");
  const ch=chat.filter(x=>x.k===k&&!x.r).map(x=>`${nmb(x.u,b)}: ${x.m}`).join("\n")||"(nobody has spoken yet)";
  const role=isImp?`You are an IMPOSTER. Your word is "${w}", but the crew has a different, similar word that you must guess from their hints. Blend in: copy the style and specificity of the crew's hints, never reveal your word, never accuse first or too aggressively, and steer suspicion toward a crew member whose hints sound odd. You win when imposters equal the crew in number.`:`You are a CREW member. Your word is "${w}". ${impsL().length} imposter(s) hold a similar but different word. Analyse every hint carefully: a hint that fits your word poorly, is too vague, or fits a different similar word is suspicious. Track earlier rounds, and never just follow accusations in chat, because imposters lie.`;
  return `You are ${nm(b)}, a sharp player in a word imposter party game with friends. ${role}\nAlive players: ${alive().map(i=>nmb(i,b)).join(", ")}. Never accuse or vote for anyone who is already out. Voted out so far: ${(R.hist||[]).join("; ")||"nobody"}. Some players are robots.\nHints so far:\n${hs}\nChat so far:\n${ch}`;
}
async function botVote(b,k){
  if(hasV(b,k)||isOut(b))return;
  const now=Date.now();let s=bv[b];
  if(!s||s.k!==k)s=bv[b]={k,sent:0,seen:0,next:now+9000+Math.random()*9000,last:0,busy:false,vt:0};
  if(s.busy)return;
  const hum=alive().filter(i=>!isBot(i));
  if(!s.vt){
    if(!hum.length)s.vt=now+8000+Math.random()*8000;
    else if(hum.some(i=>hasV(i,k)))s.vt=now+5000+Math.random()*5000;
  }
  if((s.vt&&now>=s.vt)||(R.deadline&&R.deadline-sNow()<20000)){s.busy=true;return castVote(b,k)}
  const msgs=chat.filter(x=>x.k===k&&x.u!==b&&!x.r).length;
  if(s.sent<4&&now>=s.next&&chat.filter(x=>x.k===k&&!x.r&&isBot(x.u)).length<8&&(msgs>s.seen||s.sent===0||now-s.last>40000)){
    s.busy=true;s.seen=msgs;
    const t=((await askAI(ctx(b)+CHATQ,false))||fallbackLine(b)).replace(/^"|"$/g,"").slice(0,120);
    if(code&&R&&R.phase==="vote"&&key()===k)await db.doc(`rooms/${code}/chat/${Date.now()}_${b}`).set({u:b,m:t,t:Date.now(),k}).catch(()=>{});
    s.sent++;s.last=Date.now();s.next=s.last+8000+Math.random()*8000;s.busy=false;
  }
}
async function castVote(b,k){
  const isImp=isImpId(b),others=alive().filter(i=>i!==b),byLen=[...others].sort((x,y)=>nm(y).length-nm(x).length);
  const a=await askAI(ctx(b)+`\nThink carefully about every player's hints compared with your word and the earlier rounds, then decide. Chat accusations can be lies, so never just follow them. Reply with only one player's exact name from: ${others.map(nm).join(", ")}.${isImp?" Never pick yourself.":" Reply SKIP only if you really cannot tell."}`);
  let v=a&&byLen.find(i=>a.toLowerCase().includes(nm(i).toLowerCase()));
  if(!v)v=(a&&!isImp&&/skip/i.test(a))?"skip":pick(others);
  db.doc(`rooms/${code}/players/${b}`).update({["v"+k]:v}).catch(()=>{});
}

async function makePair(){
  const L="ABCDEFGHIJKLMNOPRSTW"[Math.floor(Math.random()*20)];
  const t=await askAI(`Invent one NEW pair of two different but very similar everyday words (1 to 3 words each) for a party word game, like Coffee and Tea. Theme: ${pick(THEMES)}. For variety, the first word could start with the letter ${L}. Never reuse these pairs: ${(R.used||[]).slice(-30).join(", ")||"none"}. Reply only as JSON: {"a":"word","b":"word"}`);
  try{
    const v=JSON.parse(String(t).match(/\{[^}]*\}/)[0]);
    const x=String(v.a||"").trim().slice(0,24),y=String(v.b||"").trim().slice(0,24);
    if(x&&y&&x.toLowerCase()!==y.toLowerCase()&&!(R.used||[]).includes(x+"/"+y)&&!(R.used||[]).includes(y+"/"+x))return Math.random()<.5?[x,y]:[y,x];
  }catch(e){}
  let p,n=0;do{p=pick(FB);n++}while((R.used||[]).includes(p.join("/"))&&n<50);
  return Math.random()<.5?p:[p[1],p[0]];
}

async function claimName(n){
  n=n.trim().replace(/\s+/g," ");
  if(!n||/^robot/i.test(n))return false;
  const id=encodeURIComponent(n.toLowerCase()).slice(0,120),ref=db.doc("names/"+id);
  let s;try{s=await ref.get()}catch(e){return true}
  if(s.exists&&s.data().uid!==uid)return false;
  try{if(!s.exists)await ref.set({uid,name:n})}catch(e){return false}
  const old=ls.get("cr-namekey");if(old&&old!==id)db.doc("names/"+old).delete().catch(()=>{});
  ls.set("cr-namekey",id);return true;
}

function tick(){if(R&&isLead()){hostStep();botStep()}if(R){evt();if(R.phase==="result")award()}render()}
function hostStep(){
  const k=key(),kk=[k,R.phase,R.turn].join();
  if(R.phase==="hints"){
    if(kk===lastKey)return;
    const c=R.order[R.turn];
    if(P[c]&&P[c]["h"+k]!==undefined){
      lastKey=kk;const n=nextTurn(R.turn);
      rdoc().update(n>=0?{turn:n,deadline:sNow()+HINT_MS}:{phase:"vote",deadline:sNow()+VOTE_MS});
    }
  }else if(R.phase==="vote"){
    const al=alive();if(!al.every(i=>hasV(i,k)))return;
    const sig=k+"#"+al.map(i=>P[i]["v"+k]).join("|");
    if(sig!==lockSig){lockSig=sig;lockT=Date.now()+5000;return}
    if(Date.now()<lockT&&!(R.deadline&&sNow()>R.deadline))return;
    if(kk+"t"===lastKey)return;lastKey=kk+"t";
    tally(k,al);
  }
}
function tally(k,al){
  const c={};let skip=0;const lines=[];
  al.forEach(i=>{const v=P[i]["v"+k];lines.push(`${nm(i)} → ${v==="skip"?"skip":nm(v)}`);if(v==="skip")skip++;else c[v]=(c[v]||0)+1});
  const top=Object.entries(c).sort((a,b)=>b[1]-a[1]),[tid,tn]=top[0]||[];
  if(!tid||skip>=tn||(top[1]&&top[1][1]===tn))return rdoc().update({round:R.round+1,turn:R.order.findIndex(i=>!isOut(i)),phase:"hints",deadline:sNow()+HINT_MS,note:"No one was voted out. Give another hint.",recap:lines});
  const out=[...outs(),tid],wasImp=isImpId(tid);
  const upd={out,hist:[...(R.hist||[]),`${nm(tid)} (${wasImp?"was an imposter":"was NOT an imposter"})`],accused:tid,recap:lines,note:`${nm(tid)} was voted out. ${wasImp?"They WERE an imposter!":"They were NOT an imposter."}`};
  const ai=impsL().filter(i=>!out.includes(i)).length,ac=R.order.filter(i=>!out.includes(i)&&!isImpId(i)).length;
  if(ai===0){upd.winner="crew";upd.phase="result"}
  else if(ai>=ac){upd.winner="imposter";upd.phase="result"}
  else{upd.round=R.round+1;upd.phase="hints";upd.deadline=sNow()+HINT_MS;upd.turn=R.order.findIndex(i=>!out.includes(i))}
  if(upd.winner){const sc={...(R.scores||{})};if(upd.winner==="crew")R.order.filter(i=>!isImpId(i)&&!out.includes(i)).forEach(i=>sc[i]=(sc[i]||0)+5);else R.order.filter(isImpId).forEach(i=>sc[i]=(sc[i]||0)+10);upd.scores=sc}
  rdoc().update(upd);
}

const COL=["#FFC93C","#FF8FA3","#8FD3FF","#B8F2A0","#D5B3FF","#FFB27A"];
const logo=()=>`<div class="logo"><i aria-hidden="true">🕵️ 🔍 ❓</i><b>Clue Rush</b><span>Give clues. Find the imposter. <small style="opacity:.55">v1.6</small></span></div>`;
function render(){
  const f=document.activeElement&&document.activeElement.id,pos=f&&document.activeElement.selectionStart;
  $.innerHTML=body();
  if(f){const el=document.getElementById(f);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}
}
function body(){
  const e=err?`<p class="err">${esc(err)}</p>`:"";
  if(!ready)return authChecked?`${logo()}<p>Sign in with Google to play Clue Rush.</p><button class="main" data-act="gsign">🔐 Sign in with Google</button>${e}`:`${logo()}<p>Connecting… If this stays here, check your internet and reload.</p>`;
  if(showHow)return howUI();
  if(showBoard)return boardUI();
  if(!ready)return `${logo()}<p>Connecting… If this stays here, check your internet and reload.</p>`;
  if((!code||!R)&&!inClue)return hub();
  if(!code||!R)return `<button class="ghost" data-act="hub">← Playverse</button>${logo()}<p>Play with friends on their own phones. Create a room and share the code.</p>
  <input id="name" placeholder="Your name" maxlength="16" value="${esc(name)}" autocomplete="off">
  <button class="main" data-act="create">Create room</button>
  <input id="codein" placeholder="Room code" maxlength="4" value="${esc(codeIn)}" autocomplete="off" autocapitalize="characters">
  <button class="ghost" data-act="join">Join room</button><button class="ghost" data-act="board">🏆 Leaderboard</button><button class="ghost" data-act="how">How to play</button>${achHome()}<button class="ghost" data-act="gout">Sign out</button>${e}`;
  const ids=Object.keys(P).sort((a,b)=>P[a].at-P[b].at),isHost=isLead(),out=`<div style="display:flex;gap:8px"><button class="ghost" data-act="leave" style="flex:3">Leave room</button><button class="ghost" data-act="mute" style="flex:1" aria-label="Toggle sound">${muted()?"🔇":"🔊"}</button></div>`;
  if(R.phase==="lobby")return `${logo()}<div class="ticket"><p>Room code</p><div class="code">${code}</div><p style="letter-spacing:0;text-transform:none;font-size:.95rem">Friends open the same link and join with this code.</p></div><button class="ghost" data-act="share">Share code</button>
  <div class="list">${ids.map((i,x)=>`<div class="pl"><span style="display:flex;align-items:center;gap:10px"><span class="av" style="background:${COL[x%COL.length]}">${esc(nm(i).charAt(0).toUpperCase())}</span><b>${esc(nm(i))}${i===uid?" (you)":""}${P[i].bot?" 🤖":""} ${P[i].bot||P[i].ready?"✅":"⏳"}</b></span>${isHost&&i!==uid?`<button class="ghost x" data-act="kick" data-id="${i}" aria-label="Remove ${esc(nm(i))}">Remove</button>`:""}</div>`).join("")}</div>
  <p class="wait">${ids.length} in the room · ${ids.length>=7?"2 imposters":"1 imposter"} · waiting <span class="d">•</span><span class="d">•</span><span class="d">•</span></p><button class="${P[uid]&&P[uid].ready?"ghost":"main"}" data-act="ready">${P[uid]&&P[uid].ready?"Not ready":"I’m ready"}</button><button class="ghost" data-act="how">How to play</button><div class="spacer"></div>${isHost?`<div style="display:flex;gap:8px"><button class="ghost" data-act="addbot" style="flex:1">Add robot 🤖</button>${ids.some(i=>P[i].bot)?`<button class="ghost" data-act="rmbot" style="flex:1">Remove robot</button>`:""}</div><button class="main" data-act="start" ${ids.length<3||starting||!ids.filter(i=>!P[i].bot).every(i=>P[i].ready)?"disabled":""}>${starting?"Picking words…":ids.length<3?"Need 3 players to start":!ids.filter(i=>!P[i].bot).every(i=>P[i].ready)?"Waiting for everyone to be ready":"Start game"}</button>`:`<p>Waiting for ${esc(nm(lead()))} to start.</p>`}${e}${out}`;
  const inGame=R.order.includes(uid),k=key();
  if(!inGame)return `<div class="card"><p>A game is in progress</p><div class="big">You’ll join the next one</div></div>${out}`;
  const dead=isOut(uid),recap=R.recap&&R.recap.length?`<div class="rd"><p>Last vote</p>${R.recap.map(t=>`<div class="hl"><span>${esc(t)}</span></div>`).join("")}</div>`:"";
  const watch=dead?`<div class="card"><p>You were voted out</p><div class="big">Watching</div><p>You can watch the game, but not play.</p></div>`:role();
  if(R.phase==="hints"){
    const cur=R.order[R.turn],mine=cur===uid&&!dead;
    return `${timer()}${watch}${R.note?`<div class="card"><p>${esc(R.note)}</p></div>`:""}${recap}${hints()}${dead?"":reactUI()}<div class="spacer"></div>
    ${mine?`<p>Your turn. Give a hint for your word.</p><input id="draft" placeholder="Your hint" maxlength="40" value="${esc(draft)}" autocomplete="off"><button class="main" data-act="hint">Send hint</button>`:`<p>Waiting for ${esc(nm(cur))}…</p>`}${out}`;
  }
  if(R.phase==="vote"){
    const al=alive(),mine=dead?null:P[uid]&&P[uid]["v"+k],n=al.filter(i=>hasV(i,k)).length,all=n===al.length;
    const cnt=t=>al.filter(i=>P[i]&&P[i]["v"+k]===t).length,lab=(t,s)=>`${s} · ${cnt(t)} vote${cnt(t)===1?"":"s"}`;
    return `${timer()}${watch}${hints()}${dead?"":reactUI()}${chatUI(dead)}<div class="spacer"></div>${dead?`<p>Votes in: ${n}/${al.length}</p>`:`<p>${mine!=null?`Your vote is in (${n}/${al.length}). You can change it.`:"Who is an imposter? Most votes decides."}${all?" All votes are in. Results in a few seconds…":""}</p>
    <div class="list">${al.filter(i=>i!==uid).map(i=>`<button class="${mine===i?"main":"ghost"}" data-act="vote" data-id="${i}">${esc(lab(i,nm(i)))}</button>`).join("")}<button class="${mine==="skip"?"main":""}" data-act="vote" data-id="skip">${esc(lab("skip","Skip vote"))}</button>${mine!=null?`<button class="ghost" data-act="unvote">Remove my vote</button>`:""}</div>`}${out}`;
  }
  const won=R.winner==="crew",imps=impsL().map(nm).join(", ");
  return `<div class="card ${won?"word":"imp"}"><p>${won?"Crew wins":"Imposters win"}</p><div class="big">${esc(R.note||"")}</div><p>${impsL().length>1?"The imposters were":"The imposter was"} ${esc(imps)}.</p></div>${recap}
  <div class="hl"><b>Crew word</b><span>${esc(R.civ)}</span></div><div class="hl"><b>Imposter word</b><span>${esc(R.impw)}</span></div>${scoreUI()}${earnedUI()}${DEBUG&&lbMsg?`<p class="${lbMsg==="saved"?"wait":"err"}">Leaderboard: ${esc(lbMsg)}</p>`:""}
  <div class="spacer"></div>${isHost?`<button class="main" data-act="start" ${starting?"disabled":""}>${starting?"Picking words…":"Play again"}</button>`:`<p>Waiting for ${esc(nm(lead()))} to start the next game.</p>`}${out}`;
}

$.addEventListener("click",async ev=>{
  const b=ev.target.closest("button");if(!b)return;const a=b.dataset.act;
  try{
    if(a==="openclue"){inClue=true;render()}
    else if(a==="hub"){inClue=false;render()}
    else if(a==="gsign")googleSignIn();
    else if(a==="gout")signOut(auth).finally(()=>location.reload());
    else if(a==="create")create();
    else if(a==="join")join(codeIn);
    else if(a==="leave")leave();
    else if(a==="start")startGame();
    else if(a==="kick")db.doc(`rooms/${code}/players/${b.dataset.id}`).delete();
    else if(a==="hint"){const t=draft.trim();if(!t)return;draft="";await me().update({["h"+key()]:t.slice(0,40)})}
    else if(a==="chat"){const t=cdraft.trim();if(!t)return;cdraft="";await db.doc(`rooms/${code}/chat/${Date.now()}_${uid}`).set({u:uid,m:t.slice(0,120),t:Date.now(),k:key()})}
    else if(a==="share"){const t=`Join my Clue Rush game! Room code: ${code}\n${location.origin+location.pathname+"?room="+code}`;if(navigator.share)navigator.share({text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).catch(()=>{})}
    else if(a==="addbot"){const ks=Object.keys(P);let n=1;while(P["robot"+n])n++;if(n<=6&&ks.length<12)await db.doc(`rooms/${code}/players/robot${n}`).set({name:`Robot ${n}`,bot:true,at:Date.now()})}
    else if(a==="rmbot"){const bs=Object.keys(P).filter(i=>P[i].bot).sort();if(bs.length)await db.doc(`rooms/${code}/players/${bs[bs.length-1]}`).delete()}
    else if(a==="ready")await me().update({ready:!(P[uid]&&P[uid].ready)});
    else if(a==="board"){showBoard=true;boardRows=null;render();loadBoard()}
    else if(a==="boardx"){showBoard=false;render()}
    else if(a==="tab"){boardTab=b.dataset.t;boardRows=null;render();loadBoard()}
    else if(a==="how"){showHow=true;render()}
    else if(a==="howx"){showHow=false;render()}
    else if(a==="howen"){howLang="en";render()}
    else if(a==="howur"){howLang="ur";render()}
    else if(a==="mute"){ls.set("cr-mute",muted()?"0":"1");render()}
    else if(a==="react"){const t=Date.now();if(t-lastReact<1500||isOut(uid))return;lastReact=t;await db.doc(`rooms/${code}/chat/${t}_${uid}`).set({u:uid,m:b.dataset.e,t,k:key(),r:1})}
    else if(a==="unvote")await me().update({["v"+key()]:null});
    else if(a==="vote")await me().update({["v"+key()]:b.dataset.id});
  }catch(e){fail("That didn’t go through. Try again.")}
});
$.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="name")name=t.value;
  else if(t.id==="codein"){codeIn=t.value.toUpperCase();t.value=codeIn}
  else if(t.id==="draft")draft=t.value;
  else if(t.id==="cdraft")cdraft=t.value;
});
$.addEventListener("keydown",ev=>{if(ev.key!=="Enter")return;const b=ev.target.id==="cdraft"?"chat":ev.target.id==="draft"?"hint":null;if(b)document.querySelector(`[data-act="${b}"]`).click()});
</script>
</body>
</html>
